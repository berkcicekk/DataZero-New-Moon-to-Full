name: CI

# Compiles the Compact contract and runs the test suite on a Linux runner.
# The Compact compiler ships Linux and macOS binaries only, so this workflow is
# also the supported way to compile from a Windows checkout.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile-and-test:
    name: Compile contract and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install the Compact toolchain
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.31.1'

      - name: Report toolchain versions
        run: |
          node --version
          compact --version

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts/counter.compact
        run: npm run compile

      - name: Confirm managed/ was generated
        run: |
          test -d managed/counter/contract || { echo "managed/counter/contract missing"; exit 1; }
          echo "Generated artifacts:"
          find managed/counter -maxdepth 2 -type d | sort

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Upload compiled circuits
        uses: actions/upload-artifact@v4
        with:
          name: managed-counter
          path: managed/counter
          if-no-files-found: error
